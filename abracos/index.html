<style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#664658;--muted:#a18292;--rose:#e979a4;--deep:#d55e8d;--border:#efdae4}
*{box-sizing:border-box}html{min-height:100%;background:#fff6fa}
body{margin:0;min-height:100svh;color:var(--ink);overflow-x:clip;background:radial-gradient(ellipse 70% 46% at 52% 44%,#fffdfa,#fff1f7 70%,transparent),radial-gradient(circle at 0% 15%,#ffe0ed,transparent 35%),radial-gradient(circle at 100% 85%,#e9dffb,transparent 37%),#fff8fa}
header{height:67px;position:relative;z-index:2;width:min(100%,950px);margin:auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.8px;font-size:20px;white-space:nowrap}
.brand svg{width:38px;height:38px;background:#fff9fc;border:1px solid #f4dbe5;border-radius:13px;padding:5px;box-shadow:0 7px 20px #dda6c133}
.brand strong{color:var(--deep)}.header-note{font-size:12px;font-weight:650;color:#c794aa}
main{min-height:calc(100svh - 67px);width:min(100%,760px);padding:0 16px calc(30px + env(safe-area-inset-bottom));margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stage{width:min(100%,620px);height:min(62svh,560px);min-height:295px;position:relative;display:grid;place-items:center;isolation:isolate}
.halo{position:absolute;inset:6% 5% 5%;border-radius:50%;background:radial-gradient(circle,#fff 5%,#ffebf1 52%,#f8ddeb91 70%,transparent 80%);transition:transform .4s,filter .4s}
.stage.contact .halo{transform:scale(1.12);filter:blur(2px)}
.orbit{position:absolute;width:83%;aspect-ratio:1;border:2px dashed #edc7d66b;border-radius:50%;animation:spin 100s linear infinite;pointer-events:none}
.star{position:absolute;color:#e29cbb;font-size:clamp(22px,4vw,39px);animation:twinkle 3s ease-in-out infinite;pointer-events:none;user-select:none}
.star.a{left:7%;top:16%}.star.b{right:8%;top:14%;animation-delay:.6s}.star.c{left:12%;bottom:20%;animation-delay:1.3s}.star.d{right:11%;bottom:23%;animation-delay:1.8s}
.cat{position:relative;z-index:2;width:min(100%,530px);aspect-ratio:1;display:grid;place-items:center;border:0;padding:0;background:transparent;cursor:pointer;transform-origin:center 70%;will-change:transform;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.cat canvas{display:block;width:100%;height:auto;aspect-ratio:1;pointer-events:none;filter:drop-shadow(0 17px 15px #c28ca950)}
.cat:focus:not(:focus-visible){outline:none}.cat:focus-visible,.main-button:focus-visible{outline:3px solid #b04d7f;outline-offset:4px;border-radius:22px}
.speech{position:absolute;z-index:3;bottom:4px;left:50%;transform:translateX(-50%);min-width:180px;max-width:90%;padding:12px 18px;background:#fffefcf2;border:1px solid var(--border);border-radius:20px 20px 20px 5px;box-shadow:0 10px 30px #c88ea94b;font-weight:800;line-height:1.4;font-size:clamp(12px,2.8vw,15px)}
.speech.pop{animation:pop .35s ease}
h1{font-size:clamp(31px,7vw,49px);letter-spacing:-1.9px;margin:12px 0 8px;line-height:1.1;font-weight:900}
h1 span{color:var(--deep)}
.description{font-weight:600;font-size:clamp(13px,3vw,15px);color:var(--muted);margin:0 0 20px}
.main-button{appearance:none;border:0;border-radius:19px;padding:16px 28px;min-height:56px;background:linear-gradient(135deg,#f0a1bf,#e66d9b);color:#fff;box-shadow:0 12px 28px #e7a0ba88;font-size:16px;font-weight:850;cursor:pointer;transition:transform .18s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.main-button:hover{transform:translateY(-2px)}.main-button:active{transform:scale(.97)}
.hint{font-size:12px;color:#c59daf;font-weight:650;margin:13px 0 0}
.particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}
.p{position:fixed;top:0;left:0;opacity:0;font-size:var(--size,23px);animation:fly var(--dur,1400ms) ease-out forwards;will-change:transform,opacity}
@keyframes fly{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.5)}12%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) rotate(var(--rot,25deg)) scale(1.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.19);opacity:1}}
@keyframes pop{50%{transform:translateX(-50%) scale(1.07)}}
@media(max-width:550px){header{height:57px;padding:10px 14px}.brand{font-size:18px}.brand svg{width:37px;height:37px}.header-note{font-size:10px}main{min-height:calc(100svh - 57px);padding:0 11px calc(21px + env(safe-area-inset-bottom))}.stage{height:min(61svh,475px);min-height:275px}.orbit{width:88%}.cat{width:100%}.description{margin-bottom:17px}}
@media(max-height:670px){.stage{height:52svh;min-height:215px}h1{margin-top:8px}.description{margin-bottom:11px}.main-button{min-height:48px;padding:11px 23px}}
@media(prefers-reduced-motion:reduce){.star,.orbit{animation:none}*,*::before,*::after{scroll-behavior:auto!important}}

/* Random animation update: preserve touch UX while preventing the cat from escaping its stage. */
.cat,#cat-canvas{transition:none!important;-webkit-tap-highlight-color:transparent}
.cat{overflow:visible}
.stage{isolation:isolate}

/* Alinha o círculo e o aro ao centro VISUAL do gatinho (a arte no sprite tem uma margem maior à direita).
   Dimensões 1:1 impedem que o círculo vire uma elipse em telas menores. */
.halo,.orbit{
  left:calc(50% - clamp(14px,3.1vw,25px));
  top:50%;
  translate:-50% -50%;
}
.halo{
  inset:auto;
  left:calc(50% - clamp(14px,3.1vw,25px));
  top:50%;
  width:min(90%,540px);
  aspect-ratio:1 / 1;
}
.orbit{
  width:min(86%,520px);
  aspect-ratio:1 / 1;
}
@media(max-width:550px){
  .halo{width:min(92%,430px)}
  .orbit{width:min(87%,405px)}
}


/* Reworked stage composition: a soft, borderless glow, not a large offset pink disc. */
.stage{
  height:min(60svh,530px);
  min-height:295px;
  margin-inline:auto;
  overflow:visible;
}
.halo{
  inset:auto;
  left:50%;
  top:50%;
  translate:-50% -50%;
  width:min(80%,445px);
  height:auto;
  aspect-ratio:1/1;
  background:radial-gradient(circle at 50% 48%,
    rgba(255,255,255,.95) 0%,
    rgba(255,246,249,.95) 35%,
    rgba(255,224,235,.6) 55%,
    rgba(255,225,235,.2) 67%,
    transparent 81%);
  box-shadow:none;
  border:0;
  pointer-events:none;
}
.stage.contact .halo{transform:scale(1.065);filter:blur(3px)}
.orbit{display:none}
.cat{width:min(100%,510px);z-index:2}
#cat-canvas{
  transform:translateX(4%);
  transform-origin:center;
  filter:drop-shadow(0 18px 12px rgba(155,93,121,.19));
}
.star.a{left:15%;top:23%}
.star.b{right:15%;top:18%}
.star.c{left:17%;bottom:24%}
.star.d{right:15%;bottom:25%}
.speech{
  position:relative;
  left:auto;
  bottom:auto;
  transform:none;
  width:fit-content;
  min-width:0;
  max-width:min(85%,370px);
  margin:-8px auto 5px;
  padding:10px 18px;
  z-index:4;
  border-radius:16px;
  font-size:13px;
  box-shadow:0 8px 22px rgba(201,133,162,.14);
}
.speech.pop{animation:note-pop .3s ease}
@keyframes note-pop{0%{scale:.97}55%{scale:1.04}100%{scale:1}}
h1{margin:18px 0 8px}
.description{margin-bottom:19px}
@media(max-width:550px){
  .stage{height:min(57svh,450px);min-height:260px}
  .halo{width:min(83%,405px)}
  .cat{width:100%}
  #cat-canvas{transform:translateX(4%)}
  .speech{margin:-8px auto 2px;max-width:89%;font-size:12px;padding:10px 14px}
  h1{margin-top:16px}
}
@media(max-height:670px){
  .stage{height:52svh;min-height:205px}
  .speech{margin-top:-12px}
}
</style>

 S(1090,[10,11,12,13,12],[0,-1,1.16,0,1],[0,35,1.34,0,1],{contact:.36,pulse:2}),
 S(850,[13,14,15,0],[0,35,1.34,0,1],back,{wave:7})
 ]},
 {id:"sleepy",hello:"cheguei bem devagarinho... 🥱",end:"abraço de descanso 🧸",particles:"soft",steps:[
 S(850,[15,14,15,0,1,0],[0,5,.85,-5,1],[0,-5,.91,5,1],{wiggle:3}),
 S(570,[0,7,8,9,10],[0,-5,.91,5,1],[0,0,1.08,0,1],{wiggle:3}),
 S(1500,[10,11,12,12,12,13],[0,0,1.08,0,1],[0,27,1.27,0,1],{contact:.4,pulse:1}),
 S(950,[13,15,14,15,0],[0,27,1.27,0,1],back)
 ]},
 {id:"party",hello:"oba! chegou a hora do abraço! 🎉",end:"abraço de comemoração! 🎊",particles:"party",steps:[
 S(1130,[0,2,4,5,7,9,7,8],[0,9,.83,-12,1],[0,-25,1.09,12,1],{hop:38,hopCount:3,wiggle:18}),
 S(1130,[9,10,11,12,13,12],[0,-25,1.09,12,1],[0,36,1.38,0,1],{contact:.2,hop:13,pulse:2}),
 S(680,[12,13,14,15,0],[0,36,1.38,0,1],back,{hop:15})
 ]},
 {id:"wave-hug",hello:"oiiii! vem cá! 👋",end:"abraço com as patinhas! 🐾",particles:"paw",steps:[
 S(1050,[0,1,7,8,7,8,9,7],[0,0,.9,-8,1],[0,-6,1.02,8,1],{wiggle:17}),
 S(1040,[8,9,10,11,12,13],[0,-6,1.02,8,1],[0,39,1.36,0,1],{contact:.36,pulse:2}),
 S(670,[13,14,15,0],[0,39,1.36,0,1],back)
 ]}
];
const idleTypes=[
 {frames:[0,0,1,0,15,0],ms:3500,x:0,w:2},
 {frames:[0,14,15,0,1,0],ms:2500,x:0,w:3},
 {frames:[0,1,7,8,7,0],ms:3200,x:5,w:7},
 {frames:[0,2,4,2,0],ms:2900,x:11,w:9},
 {frames:[15,15,0,15,0],ms:3900,x:0,w:2},
 {frames:[0,1,2,3,2,1,0],ms:3200,x:10,w:5},
 {frames:[0,1,9,8,9,0],ms:3700,x:6,w:6}
];
let lastDraw=-1, current=null, previous=-1, deck=[],idleStart=performance.now(),idleIndex=0,ctxAudio=null,pressSerial=0,resetId=0;
const rand=(len)=>{if(window.crypto&&crypto.getRandomValues){const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%len}return Math.floor(Math.random()*len)};
function nextStyle(){
 if(!deck.length){
  deck=styles.map((_,i)=>i);
  for(let i=deck.length-1;i>0;i--){const j=rand(i+1);[deck[i],deck[j]]=[deck[j],deck[i]]}
  if(deck.length>1&&deck[deck.length-1]===previous)[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];
 }
 let i=deck.pop();previous=i;return styles[i];
}
function spriteFrame(n){
 n=clamp(n|0,0,15);
 if(n===lastDraw||!ctx)return;
 lastDraw=n;ctx.clearRect(0,0,460,460);
 if(!sprite.complete||!sprite.naturalWidth){ctx.font="170px system-ui";ctx.textAlign="center";ctx.fillText("🐱",230,305);return}
 const cell=sprite.naturalWidth/4;
 ctx.drawImage(sprite,(n%4)*cell,Math.floor(n/4)*cell,cell,cell,0,0,460,460);
}
sprite.addEventListener("load",()=>{lastDraw=-1;spriteFrame(0)});
function move(point){
 const scaleRatio=Math.min(1,cat.clientWidth/500);
 const [x,y,s,r,flip]=point;
 cat.style.transform="translate3d("+(x*scaleRatio).toFixed(1)+"px,"+(y*scaleRatio).toFixed(1)+"px,0) rotate("+r.toFixed(1)+"deg) scaleX("+(flip||1)+") scale("+s.toFixed(3)+")";
}
function say(t){speech.textContent=t;speech.classList.remove("pop");void speech.offsetWidth;speech.classList.add("pop")}
function initAudio(){
 if(ctxAudio)return;
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(Audio)try{ctxAudio=new Audio()}catch(e){}
}
function tone(kind){
 if(!ctxAudio||ctxAudio.state!=="running")return;
 const now=ctxAudio.currentTime;
 function n(f,time,len,gain,shape="sine"){
  try{
   const o=ctxAudio.createOscillator(),v=ctxAudio.createGain(),t=now+time;
   o.type=shape;o.frequency.value=f;
   v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(gain,t+.023);v.gain.exponentialRampToValueAtTime(.0001,t+len);
   o.connect(v).connect(ctxAudio.destination);o.start(t);o.stop(t+len+.01)
  }catch(e){}
 }
 if(kind==="step"){n(172,0,.11,.038,"triangle");n(285,.025,.07,.02)}
 if(kind==="start"){n(494,0,.15,.045);n(660,.1,.2,.045)}
 if(kind==="hug"){n(392,0,.42,.08);n(523,.09,.50,.08);n(659,.21,.59,.075);n(784,.35,.65,.065)}
}
function particles(theme){
 if(reduceMotion)return;
 const themes={
 soft:["💗","🤍","✨","🫶","♡"],spark:["✨","⭐","✦","🐾","💛"],flower:["🌸","🌼","☁️","✨","🤍"],paw:["🐾","🐱","✨","♡","🤍"],party:["🎉","🎊","⭐","✨","🐾"]
 };
 const icons=themes[theme]||themes.soft,rect=cat.getBoundingClientRect(),originX=rect.left+rect.width*.5,originY=rect.top+rect.height*.43;
 const count=innerWidth<550?27:43;
 for(let i=0;i<count;i++){
  const el=document.createElement("span");el.className="p";el.textContent=icons[rand(icons.length)];
  el.style.setProperty("--x",(originX+(Math.random()-.5)*44)+"px");
  el.style.setProperty("--y",(originY+(Math.random()-.5)*34)+"px");
  el.style.setProperty("--dx",((Math.random()-.5)*470)+"px");
  el.style.setProperty("--dy",(-80-Math.random()*260)+"px");
  el.style.setProperty("--size",(16+Math.random()*19)+"px");
  el.style.setProperty("--dur",(1000+Math.random()*950)+"ms");
  el.style.setProperty("--rot",((Math.random()-.5)*140)+"deg");
  layer.appendChild(el);el.addEventListener("animationend",()=>el.remove(),{once:true});
 }
}
function impact(style){
 stage.classList.add("contact");
 say(style.end);tone("hug");particles(style.particles);
 if(navigator.vibrate)try{navigator.vibrate([25,30,45])}catch(e){}
}
function click(){
 pressSerial++;
 initAudio();if(ctxAudio&&ctxAudio.state==="suspended")ctxAudio.resume().catch(()=>{});
 const style=nextStyle();
 clearTimeout(resetId);
 stage.classList.remove("contact");say(style.hello);
 button.textContent="🐾 Mais um abraço? Toque novamente!";
 // Every tap starts a new random choreography instantly. Taps are not queued.
 current={style,time:performance.now(),lastPart:-1,delivered:false,lastFoot:0,id:pressSerial};
 tone("start");
 if(reduceMotion){
  impact(style);spriteFrame(12);move(hugged);
  const id=pressSerial;resetId=setTimeout(()=>{if(pressSerial===id){current=null;stage.classList.remove("contact");move(back);spriteFrame(0);idleStart=performance.now();button.textContent="🤍 Receber outro abraço"}},850);
 }
}
function animate(t){
 const sequence=current.style.steps, elapsed=t-current.time;
 let offset=0,step=sequence[sequence.length-1],index=sequence.length-1;
 for(let k=0;k<sequence.length;k++){if(elapsed<offset+sequence[k].ms){step=sequence[k];index=k;break}offset+=sequence[k].ms}
 if(index!==current.lastPart)current.lastPart=index;
 const p=clamp((elapsed-offset)/step.ms,0,1);
 const easing=step.ease==="linear"?p:step.ease==="out"?out(p):inout(p);
 const point=step.from.map((v,i)=>i===4?v:mix(v,step.to[i],easing));
 if(step.hop)point[1]-=Math.abs(Math.sin(p*Math.PI*(step.hopCount||2)))*step.hop;
 if(step.wiggle)point[3]+=Math.sin(p*Math.PI*4)*step.wiggle;
 if(step.wave)point[0]+=Math.sin(p*Math.PI*4)*step.wave;
 if(step.pulse)point[2]+=Math.abs(Math.sin(p*Math.PI*step.pulse))*0.07;
 const f=step.frames[Math.min(step.frames.length-1,Math.floor(p*step.frames.length))];
 spriteFrame(f);move(point);
 if(step.steps&&t-current.lastFoot>230){current.lastFoot=t;tone("step")}
 if(step.contact!==undefined&&p>=step.contact&&!current.delivered){current.delivered=true;impact(current.style)}
 if(elapsed>=sequence.reduce((sum,k)=>sum+k.ms,0)){
  current=null;stage.classList.remove("contact");idleStart=t;lastDraw=-1;
  button.textContent="🤍 Receber outro abraço";say("quer outro? tenho muitos abraços! 🐾");
 }
}
function idle(t){
 const config=idleTypes[idleIndex],p=clamp((t-idleStart)/config.ms,0,1);
 if(p>=1){let next=rand(idleTypes.length);if(next===idleIndex)next=(next+1)%idleTypes.length;idleIndex=next;idleStart=t;return}
 const frame=config.frames[Math.min(config.frames.length-1,Math.floor(p*config.frames.length))];
 spriteFrame(frame);
 const envelope=Math.sin(Math.PI*p);
 move([config.x*Math.sin(p*Math.PI*2)*envelope,Math.sin(t/500)*-4,.93+Math.sin(t/390)*.015,config.w*Math.sin(p*Math.PI*2)*envelope,1]);
}
function loop(t){if(!document.hidden){if(current&&!reduceMotion)animate(t);else if(!current)idle(t)}requestAnimationFrame(loop)}
cat.addEventListener("click",click);button.addEventListener("click",click);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(current&&!reduceMotion){current.time=performance.now();current.delivered=false;stage.classList.remove("contact")}else idleStart=performance.now()}});
spriteFrame(0);requestAnimationFrame(loop);
})();
</script>
