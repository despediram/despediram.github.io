 function queue(){if(!raf&&enabled&&!document.hidden)raf=requestAnimationFrame(tick)}function tick(now){raf=0;if(!enabled||document.hidden)return;if(last&&now-last<30){queue();return}const delta=last?now-last:0;last=now;elapsed+=delta;render(reduce?7000:elapsed);if(!reduce&&(elapsed<6000||kind==='afterplay'))queue()}
 function replay(){started=true;elapsed=0;last=0;lastStage='';lastProgress=-1;render(reduce?7000:0);queue()}
 function state(on,rm){enabled=on;reduce=rm||motion.matches;root.classList.toggle('demo-paused',!on);root.classList.toggle('demo-reduced',reduce);if(!on){cancelAnimationFrame(raf);raf=0;last=0;return}if(!started)replay();else{render(reduce?7000:elapsed);queue()}}
 addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='ton-demo-motion')return;const d=e.data;if(d.palette!==undefined)setPalette(d.palette);if(d.action==='replay')replay();if(typeof d.enabled==='boolean')state(d.enabled,!!d.reduced)});motion.addEventListener('change',()=>state(enabled,motion.matches));document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){cancelAnimationFrame(raf);raf=0}else queue()});addEventListener('resize',resize,{passive:true});
 document.getElementById('experience').addEventListener('click',()=>{if(kind==='afterplay'){const game=document.querySelector('.game');game.hidden=false;document.querySelector('.score').textContent='0 / 3';document.querySelector('.game h2').textContent='Colete os 3 sinais.';document.querySelectorAll('.signals button').forEach(b=>b.disabled=false);body.classList.add('game-open')}else setPalette(palette+1)});
 if(kind==='afterplay'){let score=0;document.getElementById('experience').addEventListener('click',()=>score=0);document.querySelectorAll('.signals button').forEach(button=>button.addEventListener('click',()=>{button.disabled=true;score++;document.querySelector('.score').textContent=score+' / 3';if(score===3)document.querySelector('.game h2').textContent='Missão concluída!'}));document.querySelector('.back').addEventListener('click',()=>{document.querySelector('.game').hidden=true;body.classList.remove('game-open')})}
 makeController();resize();render(reduce?7000:0);if(parent===window)state(true,reduce);else send({loaded:true});
})();
